<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="adminDashboard.scss">
</head>

<body>
    <div class="wrapper">

        <div class="sidebar">
            <div class="dashboardSidebar">
                <div class="dashboardLogo">
                    <div class="dashboard"><img src="view-dashboard.svg" alt="viewDashBoard" class="sidebarLogo">
                    </div>
                    <div class="dashboardText">Dashboard</div>
                </div>

                <div class="logoNavs">
                    <div class="mainNav">
                        <div class="logoNavsContainer">
                            <div> <img src="home.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Home</div>
                        </div>

                        <div class="logoNavsContainer">
                            <div> <img src="profile.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Profile</div>
                        </div>

                        <div class="logoNavsContainer">
                            <div> <img src="message.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Messages</div>
                        </div>

                        <div class="logoNavsContainer">
                            <div> <img src="tasks.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Tasks</div>
                        </div>

                        <div class="logoNavsContainer">
                            <div> <img src="communities.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Communities</div>
                        </div>

                    </div>

                    <div class="miscs">
                        <div class="logoNavsContainer">
                            <div> <img src="settings.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Settings</div>
                        </div>

                        <div class="logoNavsContainer">
                            <div> <img src="support.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Support</div>
                        </div>

                        <div class="logoNavsContainer">
                            <div> <img src="privacy.svg" alt="homeLogo" class="sidebarLogo"> </div>
                            <div class="logoItem">Privacy</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <div class="header">
            <div class="firstRowHeader">
                <div class="searchHeader">
                    <img src="search.svg" alt="searchLogo" class="headerLogo">
                    <div class="searchBar"> </div>
                </div>

                <div class="profileHeader">
                    <img src="notification.svg" alt="notificationLogo" class="headerLogo">
                    <img src="womanProfile.svg" alt="womanProfile" class="womanProfile">
                    <div>Morgan Oakley</div>
                </div>
            </div>

            <div class="secondRowHeader">
                <div class="accountHeader">
                    <img src="womanProfile.svg" alt="womanProfile" class="womanProfile2">
                    <div>
                        <div>Hi there,</div>
                        <div>Morgan Oakley (@morgan)</div>
                    </div>
                </div>

                <div class="buttonHeader">
                    <button id="newButton">New</button>
                    <button id="uploadButton">Upload</button>
                    <button id="shareButton">Share</button>
                </div>
            </div>
        </div>

        <div class="maincontent">
            maincontent
        </div>
    </div>
</body>

</html>
